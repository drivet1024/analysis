name: Deploy Conveyor Dashboard

on:
  push:
    branches:
      - main

concurrency:
  group: conveyor-dashboard-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build and deploy
        env:
          APP_ENV_FILE: /home/deploy/secrets/analysis.env
        run: |
          docker compose \
            --project-name conveyor-dashboard \
            up -d \
            --build \
            --remove-orphans

      - name: Container status
        env:
          APP_ENV_FILE: /home/deploy/secrets/analysis.env
        run: |
          docker compose \
            --project-name conveyor-dashboard \
            ps

      - name: Recent logs
        if: always()
        env:
          APP_ENV_FILE: /home/deploy/secrets/analysis.env
        run: |
          docker compose \
            --project-name conveyor-dashboard \
            logs --tail=50
