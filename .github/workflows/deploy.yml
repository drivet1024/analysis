name: Deploy Conveyor Dashboard

on:
  push:
    branches:
      - main

concurrency:
  group: conveyor-dashboard-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]
    # Permanent storage is independent of the runner checkout and of each commit.
    env:
      APP_DATA_PATH: /opt/conveyordashboard/data
    defaults:
      run:
        working-directory: dashboard-source

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: dashboard-source

      - name: Docker versions
        run: |
          docker --version
          docker compose version

      - name: Build and deploy
        env:
          APP_ENV_FILE: /home/deploy/secrets/analysis.env
        run: |
          bash deploy/deploy-dashboard.sh

      - name: Container status
        env:
          APP_ENV_FILE: /home/deploy/secrets/analysis.env
        run: |
          docker compose \
            --project-name conveyor-dashboard \
            ps

      - name: Recent logs
        if: always()
        env:
          APP_ENV_FILE: /home/deploy/secrets/analysis.env
        run: |
          docker compose \
            --project-name conveyor-dashboard \
            logs --tail=50
