name: Deploy Docker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Docker Compose deploy
        run: |
          docker compose \
            --project-name analysis \
            up -d \
            --build \
            --remove-orphans

      - name: Show containers
        run: |
          docker compose \
            --project-name analysis \
            ps
