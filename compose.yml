services:
  conveyor-dashboard:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: conveyor-dashboard

    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - ${APP_ENV_FILE:-./ConveyorDashboard/.env.local}

    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      TZ: America/Toronto
      DEPLOYED_AT: ${DEPLOYED_AT:-}
      EDI_FORECAST_PATH: /app/App_Data/edi-forecasts

    volumes:
      - type: bind
        source: ${APP_DATA_PATH:-/opt/conveyordashboard/data}
        target: /app/App_Data
