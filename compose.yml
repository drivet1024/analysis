services:
  conveyor-dashboard:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: conveyor-dashboard

    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - ${APP_ENV_FILE:-./ConveyorDashboard/.env.local}

    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
